# Builds the .NET Framework 4.5 Windows Forms app.
# microsoft/setup-msbuild is a third-party action.
#
# windows-latest (Windows Server 2025 with Visual Studio 2026) does not include
# the v4.5 targeting pack, so reference assemblies are installed before MSBuild.
# There is no test project and no Windows Application Packaging project, so the
# stock template's dotnet test, certificate, and MSIX steps do not apply.

name: .NET Framework Desktop

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Project_Path: neurosim\neurosim.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # VS 2026 ships .NET Framework targeting packs from 4.6.2 upward, not 4.5.
    # The project imports this package when present and otherwise uses a local targeting pack.
    - name: Install .NET Framework 4.5 reference assemblies
      shell: pwsh
      run: |
        $ProgressPreference = 'SilentlyContinue'
        $packageRoot = Join-Path $env:GITHUB_WORKSPACE 'packages\Microsoft.NETFramework.ReferenceAssemblies.net45.1.0.3'
        $targets = Join-Path $packageRoot 'build\Microsoft.NETFramework.ReferenceAssemblies.net45.targets'
        $forms = Join-Path $packageRoot 'build\.NETFramework\v4.5\System.Windows.Forms.dll'
        if ((Test-Path $targets) -and (Test-Path $forms)) {
          Write-Host ".NET Framework 4.5 reference assemblies already present."
        }
        else {
          $zip = Join-Path $env:RUNNER_TEMP 'Microsoft.NETFramework.ReferenceAssemblies.net45.1.0.3.zip'
          Invoke-WebRequest -Uri 'https://www.nuget.org/api/v2/package/Microsoft.NETFramework.ReferenceAssemblies.net45/1.0.3' -OutFile $zip
          if (Test-Path $packageRoot) {
            Remove-Item -Recurse -Force $packageRoot
          }
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $packageRoot
        }
        if (-not (Test-Path $targets) -or -not (Test-Path $forms)) {
          throw "Failed to install .NET Framework 4.5 reference assemblies to $packageRoot"
        }

    # Add MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    # Build the WinForms project. Platform is AnyCPU (no space) to match the csproj.
    - name: Build
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $false
        msbuild $env:Project_Path /p:Configuration=$env:Configuration /p:Platform=AnyCPU /p:TargetFrameworkIdentifier=.NETFramework /p:TargetFrameworkVersion=v4.5 /v:minimal
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $exe = Join-Path $env:GITHUB_WORKSPACE "neurosim\bin\$env:Configuration\neurosim.exe"
        if (-not (Test-Path $exe)) {
          throw "Build did not produce $exe"
        }
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: neurosim-${{ matrix.configuration }}
        path: neurosim/bin/${{ matrix.configuration }}
        if-no-files-found: error
